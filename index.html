<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gee La Fu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
    h1 {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: monospace;
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 0.3em;
      color: #fff;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <h1>GEE LA FU</h1>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const points = [
      { x: Math.random(), y: Math.random(), color: '255,0,0' },
      { x: Math.random(), y: Math.random(), color: '0,0,255' },
      { x: Math.random(), y: Math.random(), color: '80,0,120' }
    ];

    const velocity = points.map(() => ({
      vx: (Math.random() - 0.5) * 0.003,
      vy: (Math.random() - 0.5) * 0.003
    }));

    function draw() {
      const W = canvas.width;
      const H = canvas.height;
      const radius = Math.max(W, H) * 0.7;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);

      for (let i = 0; i < points.length; i++) {
        points[i].x += velocity[i].vx;
        points[i].y += velocity[i].vy;
        if (points[i].x < 0 || points[i].x > 1) velocity[i].vx *= -1;
        if (points[i].y < 0 || points[i].y > 1) velocity[i].vy *= -1;

        const px = points[i].x * W;
        const py = points[i].y * H;
        const grad = ctx.createRadialGradient(px, py, 0, px, py, radius);
        grad.addColorStop(0, `rgba(${points[i].color},0.8)`);
        grad.addColorStop(1, `rgba(${points[i].color},0)`);

        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
      }

      requestAnimationFrame(draw);
    }

    draw();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
