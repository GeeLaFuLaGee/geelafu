<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gee La Fu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #content {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      pointer-events: none;
    }
    h1 {
      font-family: monospace;
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 0.3em;
      color: #fff;
    }
    img#artwork {
      width: 40vw;
      max-height: 60vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="content">
    <h1>GEE LA FU</h1>
    <img id="artwork" src="" alt="">
  </div>
  <script>
    const images = [
      'IMG_0804.JPG',
      'IMG_0813.JPG',
      'IMG_0816.JPG',
      'IMG_0817.JPG',
      'IMG_2699.JPG'
    ];
    function sampleColors(img) {
      const offscreen = document.createElement('canvas');
      offscreen.width = 10;
      offscreen.height = 10;
      const octx = offscreen.getContext('2d');
      octx.drawImage(img, 0, 0, 10, 10);
      const data = octx.getImageData(0, 0, 10, 10).data;
      const positions = [10, 50, 90];
      return positions.map(pct => {
        const idx = Math.floor(pct / 100 * 99) * 4;
        return { r: data[idx], g: data[idx+1], b: data[idx+2] };
      });
    }
    function startAnimation(points) {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const RES = 200;
      canvas.width = RES;
      canvas.height = RES;
      const velocity = points.map(() => ({
        vx: ((Math.random() * 0.003) + 0.001) * (Math.random() < 0.5 ? 1 : -1),
        vy: ((Math.random() * 0.003) + 0.001) * (Math.random() < 0.5 ? 1 : -1)
      }));
      function draw() {
        for (let i = 0; i < points.length; i++) {
          points[i].x += velocity[i].vx;
          points[i].y += velocity[i].vy;
          if (points[i].x <= 0) { points[i].x = 0; velocity[i].vx = Math.abs(velocity[i].vx); }
          if (points[i].x >= 1) { points[i].x = 1; velocity[i].vx = -Math.abs(velocity[i].vx); }
          if (points[i].y <= 0) { points[i].y = 0; velocity[i].vy = Math.abs(velocity[i].vy); }
          if (points[i].y >= 1) { points[i].y = 1; velocity[i].vy = -Math.abs(velocity[i].vy); }
        }
        const img = ctx.createImageData(RES, RES);
        const d = img.data;
        for (let y = 0; y < RES; y++) {
          for (let x = 0; x < RES; x++) {
            const nx = x / RES;
            const ny = y / RES;
            let totalW = 0;
            let r = 0, g = 0, b = 0;
            for (const p of points) {
              const dx = nx - p.x;
              const dy = ny - p.y;
              const w = 1 / (dx * dx + dy * dy + 0.0001);
              totalW += w;
              r += p.r * w;
              g += p.g * w;
              b += p.b * w;
            }
            const idx = (y * RES + x) * 4;
            d[idx]     = r / totalW;
            d[idx + 1] = g / totalW;
            d[idx + 2] = b / totalW;
            d[idx + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        requestAnimationFrame(draw);
      }
      draw();
    }
    const randomImage = images[Math.floor(Math.random() * images.length)];
    const img = new Image();
    img.onload = function() {
      const colors = sampleColors(img);
      const points = colors.map(c => ({
        x: Math.random(),
        y: Math.random(),
        r: c.r,
        g: c.g,
        b: c.b
      }));
      startAnimation(points);
      const artwork = document.getElementById('artwork');
      artwork.src = randomImage;
    };
    img.src = randomImage;
  </script>
</body>
</html>
