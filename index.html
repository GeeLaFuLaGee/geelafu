<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gee La Fu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    h1 {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: monospace;
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 0.3em;
      color: #fff;
      mix-blend-mode: difference;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <h1>GEE LA FU</h1>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    const points = [
  { x: Math.random(), y: Math.random(), r: 255, g: 0, b: 0 },
  { x: Math.random(), y: Math.random(), r: 0, g: 0, b: 255 },
  { x: Math.random(), y: Math.random(), r: 0, g: 255, b: 0 }
];

    function draw() {
      const W = canvas.offsetWidth;
      const H = canvas.offsetHeight;
      canvas.width = W;
      canvas.height = H;

      const img = ctx.createImageData(W, H);
      const d = img.data;

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const nx = x / W;
          const ny = y / H;

          let totalW = 0;
          let r = 0, g = 0, b = 0;

          for (const p of points) {
            const dx = nx - p.x;
            const dy = ny - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const w = 1 / (dist * dist + 0.0001);
            totalW += w;
            r += p.r * w;
            g += p.g * w;
            b += p.b * w;
          }
          const i = (y * W + x) * 4;
          d[i]     = r / totalW;
          d[i + 1] = g / totalW;
          d[i + 2] = b / totalW;
          d[i + 3] = 255;
        }
      }

      ctx.putImageData(img, 0, 0);
    }

    draw();
    window.addEventListener('resize', draw);
  </script>
</body>
</html>
