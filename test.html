<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gee La Fu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
    }

    h1 {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: monospace;
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 0.3em;
      color: #fff;
      white-space: nowrap;
      z-index: 10;
    }

    #artwork-wrap {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    img#artwork {
      display: block;
      max-width: 40vw;
      max-height: 60vh;
      width: auto;
      height: auto;
      cursor: pointer;
    }

    #panel {
      position: fixed;
      z-index: 20;
      background: rgba(0, 0, 0, 0.75);
      overflow-y: auto;
      transition: transform 0.6s ease;
    }

    @media (orientation: landscape) {
      #panel {
        top: 0;
        right: 0;
        width: 35vw;
        height: 100vh;
        transform: translateX(100%);
      }
      #panel.open {
        transform: translateX(0);
      }
    }

    @media (orientation: portrait) {
      img#artwork {
        max-width: 80vw;
        max-height: 50vh;
      }
      #panel {
        bottom: 0;
        left: 0;
        width: 100vw;
        height: 60vh;
        transform: translateY(100%);
      }
      #panel.open {
        transform: translateY(0);
      }
    }

    #panel-inner {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      font-family: monospace;
      color: #fff;
      min-height: 100%;
    }

    #meta-title {
      font-size: 1rem;
      letter-spacing: 0.15em;
      font-weight: bold;
    }

    #meta-description {
      font-size: 0.8rem;
      line-height: 1.7;
      letter-spacing: 0.05em;
      opacity: 0.85;
    }

    #meta-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    #meta-date,
    #meta-creator,
    #meta-jobtitle {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      opacity: 0.6;
    }

    #nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2rem;
      z-index: 50;
    }

    .nav-btn {
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      border: none;
      background: #fff;
      font-family: monospace;
      font-size: 0.55rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.5rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    #menu {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: transparent;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #menu.open {
      opacity: 1;
      pointer-events: all;
    }

    .menu-option {
      pointer-events: none;
      width: 100%;
      max-width: 400px;
      flex: 1;
      max-height: 200px;
      background: #fff;
      border: 1px solid #fff;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      cursor: pointer;
      text-decoration: none;
      color: #000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .menu-option:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <h1>GEE LA FU</h1>
  <div id="artwork-wrap">
    <img id="artwork" src="" alt="">
  </div>

  <div id="panel">
    <div id="panel-inner">
      <div id="meta-title"></div>
      <div id="meta-description"></div>
      <div id="meta-footer">
        <div id="meta-date"></div>
        <div id="meta-creator"></div>
        <div id="meta-jobtitle"></div>
      </div>
    </div>
  </div>

  <div id="nav">
    <button class="nav-btn" id="btn-refresh">REFRESH</button>
    <button class="nav-btn" id="btn-menu">MENU</button>
  </div>

  <div id="menu">
    <a class="menu-option" href="analogue.html">SHOW ME ANALOGUE ARTWORK</a>
    <a class="menu-option" href="digital.html">SHOW ME DIGITAL ARTWORK</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
  <script>
    const images = [
      'IMG_0804.JPG',
      'IMG_0813.JPG',
      'IMG_0816.JPG',
      'IMG_0817.JPG',
      'IMG_2699.JPG'
    ];

    function sampleColors(img) {
      const offscreen = document.createElement('canvas');
      offscreen.width = 10;
      offscreen.height = 10;
      const octx = offscreen.getContext('2d');
      octx.drawImage(img, 0, 0, 10, 10);
      const data = octx.getImageData(0, 0, 10, 10).data;
      const positions = [10, 50, 90];
      return positions.map(pct => {
        const idx = Math.floor(pct / 100 * 99) * 4;
        return { r: data[idx], g: data[idx+1], b: data[idx+2] };
      });
    }

    function startAnimation(points) {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const RES = 200;
      canvas.width = RES;
      canvas.height = RES;
      const velocity = points.map(() => ({
        vx: ((Math.random() * 0.003) + 0.001) * (Math.random() < 0.5 ? 1 : -1),
        vy: ((Math.random() * 0.003) + 0.001) * (Math.random() < 0.5 ? 1 : -1)
      }));
      function draw() {
        for (let i = 0; i < points.length; i++) {
          points[i].x += velocity[i].vx;
          points[i].y += velocity[i].vy;
          if (points[i].x <= 0) { points[i].x = 0; velocity[i].vx = Math.abs(velocity[i].vx); }
          if (points[i].x >= 1) { points[i].x = 1; velocity[i].vx = -Math.abs(velocity[i].vx); }
          if (points[i].y <= 0) { points[i].y = 0; velocity[i].vy = Math.abs(velocity[i].vy); }
          if (points[i].y >= 1) { points[i].y = 1; velocity[i].vy = -Math.abs(velocity[i].vy); }
        }
        const img = ctx.createImageData(RES, RES);
        const d = img.data;
        for (let y = 0; y < RES; y++) {
          for (let x = 0; x < RES; x++) {
            const nx = x / RES;
            const ny = y / RES;
            let totalW = 0;
            let r = 0, g = 0, b = 0;
            for (const p of points) {
              const dx = nx - p.x;
              const dy = ny - p.y;
              const w = 1 / (dx * dx + dy * dy + 0.0001);
              totalW += w;
              r += p.r * w;
              g += p.g * w;
              b += p.b * w;
            }
            const idx = (y * RES + x) * 4;
            d[idx]     = r / totalW;
            d[idx + 1] = g / totalW;
            d[idx + 2] = b / totalW;
            d[idx + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        requestAnimationFrame(draw);
      }
      draw();
    }

    async function loadMeta(filename) {
      try {
        const meta = await exifr.parse(filename, { xmp: true, iptc: true, exif: false });
        if (!meta) return;
        document.getElementById('meta-title').textContent =
          meta.Title || meta.ObjectName || '';
        document.getElementById('meta-description').textContent =
          meta.Description || meta.ImageDescription || '';
        const date = meta.DateCreated;
        if (date) {
          let display = String(date);
          if (display.length === 8 && !display.includes(':')) {
            display = `${display.slice(6)} / ${display.slice(4,6)} / ${display.slice(0,4)}`;
          } else if (display.includes(':')) {
            const parts = display.split(':');
            if (parts.length === 3) {
              display = `${parts[2]} / ${parts[1]} / ${parts[0]}`;
            }
          } else {
            const d = new Date(date);
            if (!isNaN(d)) display = d.toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
          }
          document.getElementById('meta-date').textContent = display;
        }
        document.getElementById('meta-creator').textContent =
          meta.Creator || meta.Artist || '';
        document.getElementById('meta-jobtitle').textContent =
          meta.AuthorsPosition || '';
      } catch(e) {
        console.log('metadata fout', e);
      }
    }

    const artwork = document.getElementById('artwork');
    const panel = document.getElementById('panel');
    const menu = document.getElementById('menu');
    const btnRefresh = document.getElementById('btn-refresh');
    const btnMenu = document.getElementById('btn-menu');

    artwork.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = panel.classList.toggle('open');
      document.getElementById('nav').style.visibility = isOpen ? 'hidden' : 'visible';
    });

    panel.addEventListener('click', (e) => {
      e.stopPropagation();
      panel.classList.remove('open');
      document.getElementById('nav').style.visibility = 'visible';
    });

    btnRefresh.addEventListener('click', () => {
      window.location.reload();
    });

    btnMenu.addEventListener('click', () => {
      const isOpen = menu.classList.toggle('open');
      btnRefresh.disabled = isOpen;
      btnMenu.textContent = isOpen ? 'STAY' : 'MENU';
    });

    const lastImage = sessionStorage.getItem('lastImage');
    const available = lastImage
      ? images.filter(i => i !== lastImage)
      : images;
    const randomImage = available[Math.floor(Math.random() * available.length)];
    sessionStorage.setItem('lastImage', randomImage);

    const img = new Image();
    img.onload = function() {
      const colors = sampleColors(img);
      const points = colors.map(c => ({
        x: Math.random(),
        y: Math.random(),
        r: c.r,
        g: c.g,
        b: c.b
      }));
      startAnimation(points);
      artwork.src = randomImage;
      loadMeta(randomImage);
      setTimeout(() => {
        const rect = artwork.getBoundingClientRect();
        const bottomOfPhoto = rect.bottom;
        const bottomOfScreen = window.innerHeight;
        const middle = bottomOfPhoto + (bottomOfScreen - bottomOfPhoto) / 2;
        const nav = document.getElementById('nav');
        nav.style.top = middle + 'px';
        nav.style.transform = 'translate(-50%, -50%)';
      }, 200);
    };
    img.src = randomImage;
  </script>
</body>
</html>
