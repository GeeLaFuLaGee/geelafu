<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gee La Fu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #content {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    h1 {
      font-family: monospace;
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 0.3em;
      color: #fff;
      pointer-events: none;
    }
    #card {
      display: flex;
      flex-direction: row;
      gap: 0;
      align-items: stretch;
    }
    img#artwork {
      max-width: 40vw;
      max-height: 60vh;
      width: auto;
      height: auto;
      display: block;
      cursor: pointer;
      flex-shrink: 0;
    }
    #panel {
      width: 0;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.25);
      overflow-y: auto;
      overflow-x: hidden;
      transition: width 0.6s ease;
    }
    #card.open #panel {
      width: var(--panel-width, 40vw);
    }
    #panel-inner {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 0;
      font-family: monospace;
      color: #fff;
    }
    #meta-title {
      font-size: 1rem;
      letter-spacing: 0.15em;
      font-weight: bold;
    }
    #meta-description {
      font-size: 0.8rem;
      line-height: 1.7;
      letter-spacing: 0.05em;
      opacity: 0.85;
    }
    #meta-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    #meta-date,
    #meta-creator,
    #meta-jobtitle {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="content">
    <h1>GEE LA FU</h1>
    <div id="card">
      <img id="artwork" src="" alt="">
      <div id="panel">
        <div id="panel-inner">
          <div id="meta-title"></div>
          <div id="meta-description"></div>
          <div id="meta-footer">
            <div id="meta-date"></div>
            <div id="meta-creator"></div>
            <div id="meta-jobtitle"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
  <script>
    const images = [
      'IMG_0804.JPG',
      'IMG_0813.JPG',
      'IMG_0816.JPG',
      'IMG_0817.JPG',
      'IMG_2699.JPG'
    ];

    function sampleColors(img) {
      const offscreen = document.createElement('canvas');
      offscreen.width = 10;
      offscreen.height = 10;
      const octx = offscreen.getContext('2d');
      octx.drawImage(img, 0, 0, 10, 10);
      const data = octx.getImageData(0, 0, 10, 10).data;
      const positions = [10, 50, 90];
      return positions.map(pct => {
        const idx = Math.floor(pct / 100 * 99) * 4;
        return { r: data[idx], g: data[idx+1], b: data[idx+2] };
      });
    }

    function startAnimation(points) {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const RES = 200;
      canvas.width = RES;
      canvas.height = RES;
      const velocity = points.map(() => ({
        vx: ((Math.random() * 0.003) + 0.001) * (Math.random() < 0.5 ? 1 : -1),
        vy: ((Math.random() * 0.003) + 0.001) * (Math.random() < 0.5 ? 1 : -1)
      }));
      function draw() {
        for (let i = 0; i < points.length; i++) {
          points[i].x += velocity[i].vx;
          points[i].y += velocity[i].vy;
          if (points[i].x <= 0) { points[i].x = 0; velocity[i].vx = Math.abs(velocity[i].vx); }
          if (points[i].x >= 1) { points[i].x = 1; velocity[i].vx = -Math.abs(velocity[i].vx); }
          if (points[i].y <= 0) { points[i].y = 0; velocity[i].vy = Math.abs(velocity[i].vy); }
          if (points[i].y >= 1) { points[i].y = 1; velocity[i].vy = -Math.abs(velocity[i].vy); }
        }
        const img = ctx.createImageData(RES, RES);
        const d = img.data;
        for (let y = 0; y < RES; y++) {
          for (let x = 0; x < RES; x++) {
            const nx = x / RES;
            const ny = y / RES;
            let totalW = 0;
            let r = 0, g = 0, b = 0;
            for (const p of points) {
              const dx = nx - p.x;
              const dy = ny - p.y;
              const w = 1 / (dx * dx + dy * dy + 0.0001);
              totalW += w;
              r += p.r * w;
              g += p.g * w;
              b += p.b * w;
            }
            const idx = (y * RES + x) * 4;
            d[idx]     = r / totalW;
            d[idx + 1] = g / totalW;
            d[idx + 2] = b / totalW;
            d[idx + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        requestAnimationFrame(draw);
      }
      draw();
    }

    async function loadMeta(filename) {
      try {
        const meta = await exifr.parse(filename, { xmp: true, iptc: true, exif: false });
        if (!meta) return;
        document.getElementById('meta-title').textContent =
          meta.Title || meta.ObjectName || '';
        document.getElementById('meta-description').textContent =
          meta.Description || meta.ImageDescription || '';
        const date = meta.DateCreated;
        if (date) {
          let display = String(date);
          if (display.length === 8 && !display.includes(':')) {
            display = `${display.slice(6)} / ${display.slice(4,6)} / ${display.slice(0,4)}`;
          } else if (display.includes(':')) {
            const parts = display.split(':');
            if (parts.length === 3) {
              display = `${parts[2]} / ${parts[1]} / ${parts[0]}`;
            }
          } else {
            const d = new Date(date);
            if (!isNaN(d)) display = d.toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
          }
          document.getElementById('meta-date').textContent = display;
        }
        document.getElementById('meta-creator').textContent =
          meta.Creator || meta.Artist || '';
        document.getElementById('meta-jobtitle').textContent =
          meta.AuthorsPosition || '';
      } catch(e) {
        console.log('metadata fout', e);
      }
    }

    const artwork = document.getElementById('artwork');
    const panel = document.getElementById('panel');
    const card = document.getElementById('card');

    artwork.addEventListener('click', () => {
      card.classList.toggle('open');
    });

    const randomImage = images[Math.floor(Math.random() * images.length)];
    const img = new Image();
    img.onload = function() {
      const colors = sampleColors(img);
      const points = colors.map(c => ({
        x: Math.random(),
        y: Math.random(),
        r: c.r,
        g: c.g,
        b: c.b
      }));
      startAnimation(points);
      artwork.src = randomImage;
      loadMeta(randomImage);
      setTimeout(() => {
        const w = artwork.offsetWidth;
        const h = artwork.offsetHeight;
        panel.style.height = h + 'px';
        card.style.setProperty('--panel-width', w + 'px');
      }, 100);
    };
    img.src = randomImage;
  </script>
</body>
</html>
