<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gee La Fu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; image-rendering: auto; }
    h1 {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: monospace;
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 0.3em;
      color: #fff;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <h1>GEE LA FU</h1>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const RES = 200;
    canvas.width = RES;
    canvas.height = RES;

    const points = [
      { x: Math.random(), y: Math.random(), r: 255, g: 0, b: 0 },
      { x: Math.random(), y: Math.random(), r: 0, g: 0, b: 255 },
      { x: Math.random(), y: Math.random(), r: 80, g: 0, b: 120 }
    ];

    const velocity = points.map(() => ({
      vx: ((Math.random() * 0.003) + 0.001) * (Math.random() < 0.5 ? 1 : -1),
      vy: ((Math.random() * 0.003) + 0.001) * (Math.random() < 0.5 ? 1 : -1)
    }));

    function draw() {
      for (let i = 0; i < points.length; i++) {
        points[i].x += velocity[i].vx;
        points[i].y += velocity[i].vy;
        if (points[i].x <= 0) { points[i].x = 0; velocity[i].vx = Math.abs(velocity[i].vx); }
        if (points[i].x >= 1) { points[i].x = 1; velocity[i].vx = -Math.abs(velocity[i].vx); }
        if (points[i].y <= 0) { points[i].y = 0; velocity[i].vy = Math.abs(velocity[i].vy); }
        if (points[i].y >= 1) { points[i].y = 1; velocity[i].vy = -Math.abs(velocity[i].vy); }
      }

      const img = ctx.createImageData(RES, RES);
      const d = img.data;
      const edge = 0.15;

      for (let y = 0; y < RES; y++) {
        for (let x = 0; x < RES; x++) {
          const nx = x / RES;
          const ny = y / RES;

          let totalW = 0;
          let r = 0, g = 0, b = 0;

          for (const p of points) {
            const dx = nx - p.x;
            const dy = ny - p.y;
            const w = 1 / (dx * dx + dy * dy + 0.0001);
            totalW += w;
            r += p.r * w;
            g += p.g * w;
            b += p.b * w;
          }

          const idx = (y * RES + x) * 4;
          d[idx]     = r / totalW;
          d[idx + 1] = g / totalW;
          d[idx + 2] = b / totalW;
          d[idx + 3] = 255;
        }
      }

      ctx.putImageData(img, 0, 0);
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
